<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>靜態頁目錄</title>
<style>
:root {
  --bg: #f6f4ef;
  --ink: #23211d;
  --muted: #6d675d;
  --line: rgba(35, 33, 29, 0.14);
  --accent: #9a6b32;
  --font-ui: "PingFang TC", "Noto Sans TC", "Heiti TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14151a; --ink: #eeeae2; --muted: #a39d92; --line: rgba(238, 234, 226, 0.14); --accent: #d6a463; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #14151a; --ink: #eeeae2; --muted: #a39d92; --line: rgba(238, 234, 226, 0.14); --accent: #d6a463; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li { border-bottom: 1px solid var(--line); }
a { display: block; padding: 14px 4px; color: var(--ink); text-decoration: none; }
a:hover strong, a:focus-visible strong { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
small { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
</style>
</head>
