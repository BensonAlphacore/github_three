<style>
  /* 全螢幕 3D 場景，左上角一張可收合的控制卡 */
  :root {
    --bg: #e9e2d4;
    --panel: rgba(252, 250, 245, 0.92);
    --fg: #2a241c;
    --muted: #6d6455;
    --line: #d6ccb9;
    --accent: #8a6a2f;
    --accent-fg: #ffffff;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-display: "Noto Serif TC", "Songti TC", serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --panel: rgba(34, 30, 24, 0.92); --fg: #efe8db; --muted: #aa9f8c;
      --line: #463e31; --accent: #d4b06a; --accent-fg: #1d170d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --panel: rgba(34, 30, 24, 0.92); --fg: #efe8db; --muted: #aa9f8c;
    --line: #463e31; --accent: #d4b06a; --accent-fg: #1d170d; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(320px, calc(100% - 32px));
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid;
    gap: 12px;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .body { display: grid; gap: 12px; }
  .toggle { flex: none; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .toggle:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .panel.collapsed { width: auto; padding-block: 10px; }
  .panel.collapsed .eyebrow { display: none; }
  .panel.collapsed h1 { margin: 0; font-size: 17px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  h1 { margin: 2px 0 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 0.04em; text-wrap: balance; }
  .dims { display: grid; gap: 4px; margin: 0; font-size: 12px; }
  .dims div { display: flex; justify-content: space-between; gap: 12px; }
  .dims dt { color: var(--muted); }
  .dims dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .label { font-size: 11px; color: var(--muted); margin-bottom: -6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; padding: 7px 0; cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 500; }
  .seg button:hover:not([aria-pressed="true"]) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .row input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  button:focus-visible, .row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note, .hint { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 520px) { .note { display: none; } .seg button { font-size: 12px; } }

  /* 鍵盤操作說明：開場浮在畫面下方的半透明鍵帽 */
  .keyhint {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    transform: translate(-50%, 10px); opacity: 0; transition: opacity 0.35s, transform 0.35s;
    max-width: calc(100% - 32px); padding: 14px 20px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--panel) 60%, transparent); backdrop-filter: blur(10px);
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    color: var(--fg); display: grid; gap: 10px; cursor: pointer;
  }
  .keyhint.on { opacity: 1; transform: translate(-50%, 0); }
  .kh-title { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-align: center; }
  .kh-groups { display: flex; gap: 26px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
  .kh-group { display: grid; gap: 6px; justify-items: center; }
  .kh-row { display: flex; gap: 6px; }
  .key { display: grid; justify-items: center; gap: 4px; }
  .key kbd {
    min-width: 40px; height: 40px; padding: 0 9px; display: grid; place-items: center; border-radius: 8px;
    font: 600 15px var(--font-mono); color: var(--fg);
    background: color-mix(in srgb, var(--panel) 70%, transparent); border: 1px solid var(--line);
    box-shadow: 0 3px 0 color-mix(in srgb, var(--fg) 22%, transparent);
    transition: transform 0.08s, background 0.08s, color 0.08s;
  }
  .key.down kbd { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 22%, transparent); background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .key span { font-size: 11px; color: var(--muted); }
  .mouse-wrap { display: flex; gap: 10px; align-items: center; }
  .mouse { width: 34px; height: 50px; overflow: visible; }
  .m-body { fill: color-mix(in srgb, var(--panel) 70%, transparent); stroke: var(--line); stroke-width: 1.5; }
  .m-btn { fill: transparent; stroke: var(--line); stroke-width: 1.5; transition: fill 0.08s; }
  .m-wheel { fill: var(--muted); transition: fill 0.08s; }
  .m-btn.down, .m-wheel.down { fill: var(--accent); }
  .mouse-labels { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
  .mouse-labels b { color: var(--fg); font-weight: 600; margin-right: 4px; }
  .mouse-labels span.down b { color: var(--accent); }
  .kh-foot { font-size: 11px; color: var(--muted); text-align: center; }
  .linkbtn { justify-self: start; border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .keyhint, .key kbd { transition: none; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// 單位：公尺。y=0 是大廳地面。中庭 x ±22、z ±18；南邊是入口長廊，北邊是手扶梯廳
const ATR = { x: 22, z: 18 };
const LEVELS = [6, 10.5, 15];           // 三層迴廊的樓板頂面
const SLAB_T = 0.9;
const WALL_TOP = 19.5;
const RIDGE = { y: 24.5, half: 4 };     // 天窗屋脊
const ENTRY = { x: 10, z0: 18, z1: 40, h: 7.2 };
const ESC = { x: 7, z0: -18, z1: -31, h: 15.5, mezz: 6, mezzZ: -25.4 };
const BULGE = [1.2, 2.4, 1.0];

if (matchMedia('(pointer: coarse)').matches) {
  document.getElementById('hint').textContent = '單指旋轉、雙指縮放與平移。';
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: location.search.includes('rec') });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const walkables = [];      // 鍵盤走動時腳下可以踩的面
const solids = [];         // 走路會撞到的東西：圓柱 { x, z, r, y0, y1 } 或方塊 { box: [x0, x1, z0, z1], y0, y1 }
scene.background = new THREE.Color(0xd4e2ec);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomToCursor = true;
controls.minDistance = 0.8;
controls.maxDistance = 700;

let seed = 19900801;
const rand = () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
const UP = new THREE.Vector3(0, 1, 0);
const envMats = [];          // 夜晚時要把環境反光調暗的材質
const mat = (color, opts = {}) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...opts });
  m.userData.env = opts.envMapIntensity ?? 1;
  envMats.push(m);
  return m;
};
const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const angDiff = (p, q) => Math.abs(Math.atan2(Math.sin(p - q), Math.cos(p - q)));

function tubeBetween(from, to, r, seg = 10) {
  const dir = to.clone().sub(from);
  const g = new THREE.CylinderGeometry(r, r, dir.length(), seg);
  g.applyMatrix4(new THREE.Matrix4().compose(
    from.clone().add(to).multiplyScalar(0.5),
    new THREE.Quaternion().setFromUnitVectors(UP, dir.normalize()),
    new THREE.Vector3(1, 1, 1)));
  return g;
}

// 沿一串點拉出垂直帶子，u 是沿線的公尺數（貼欄杆貼圖用）
function ribbon(points, y0, y1, closed = true, skip = null) {
  const pts = closed ? [...points, points[0]] : points;
  const pos = [], uv = [], idx = [];
  let len = 0;
  pts.forEach((p, i) => {
    if (i > 0) len += Math.hypot(p.x - pts[i - 1].x, p.z - pts[i - 1].z);
    pos.push(p.x, y0, p.z, p.x, y1, p.z);
    uv.push(len, 0, len, 1);
    if (i > 0 && !(skip && skip(pts[i - 1], p))) { const a = (i - 1) * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
// 往外（離中心）推 d 公尺
const offsetPts = (pts, d) => pts.map((p, i) => {
  const a = pts[(i - 1 + pts.length) % pts.length], b = pts[(i + 1) % pts.length];
  let nx = b.z - a.z, nz = -(b.x - a.x);
  const l = Math.hypot(nx, nz) || 1;
  nx /= l; nz /= l;
  if (nx * p.x + nz * p.z < 0) { nx = -nx; nz = -nz; }
  return { x: p.x + nx * d, z: p.z + nz * d };
});

// 中庭開口：圓角方形，每邊中段的陽台往中庭凸出一塊
function voidOutline(bulge, N = 260) {
  const A = 15.5, B = 11.5, n = 3.4, pts = [];
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
    let x = A * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    let z = B * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    const bx = bulge * (Math.exp(-(angDiff(t, 0) ** 2) / 0.04) + Math.exp(-(angDiff(t, Math.PI) ** 2) / 0.04));
    const bz = bulge * (Math.exp(-(angDiff(t, Math.PI / 2) ** 2) / 0.06) + Math.exp(-(angDiff(t, -Math.PI / 2) ** 2) / 0.06));
    x -= Math.sign(c) * bx;
    z -= Math.sign(s) * bz;
    pts.push({ x, z });
  }
  return pts;
}

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
function veins(g, w, h, n, color, width = 1.2) {
  g.strokeStyle = color;
  for (let i = 0; i < n; i++) {
    g.lineWidth = width * (0.4 + rand());
    let x = rand() * w, y = rand() * h;
    g.beginPath();
    g.moveTo(x, y);
    for (let k = 0; k < 4; k++) {
      const nx = x + (rand() - 0.3) * w * 0.25, ny = y + (rand() - 0.5) * h * 0.25;
      g.quadraticCurveTo((x + nx) / 2 + (rand() - 0.5) * 40, (y + ny) / 2 + (rand() - 0.5) * 40, nx, ny);
      x = nx; y = ny;
    }
    g.stroke();
  }
}

// ---------- 貼圖 ----------
const FLOOR = { x0: -ATR.x, x1: ATR.x, z0: ESC.z1, z1: ENTRY.z1 };
function floorTexture() {
  const W = FLOOR.x1 - FLOOR.x0, D = FLOOR.z1 - FLOOR.z0;
  const ppm = 36;
  return canvasTex(W * ppm, D * ppm, (g, w, h) => {
    const X = x => (x - FLOOR.x0) * ppm, Z = z => (z - FLOOR.z0) * ppm;
    g.fillStyle = '#d7c19a';
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = `rgba(${rand() < 0.5 ? '255,245,225' : '170,140,100'},${0.05 + rand() * 0.08})`;
      g.beginPath();
      g.ellipse(rand() * w, rand() * h, 40 + rand() * 160, 20 + rand() * 80, rand() * 3, 0, Math.PI * 2);
      g.fill();
    }
    veins(g, w, h, 140, 'rgba(120,92,58,0.22)');
    // 1.2 m 大理石磚縫
    g.strokeStyle = 'rgba(110,86,55,0.25)';
    g.lineWidth = 1;
    for (let x = 0; x < w; x += 1.2 * ppm) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y < h; y += 1.2 * ppm) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    // 手扶梯廳：深色石材
    g.fillStyle = '#3d322a';
    g.fillRect(X(-ESC.x), 0, ESC.x * 2 * ppm, Z(ESC.z0));
    veins(g, w, Z(ESC.z0), 30, 'rgba(200,180,150,0.18)');
    // 中庭中央的放射拼花
    const cx = X(0), cy = Z(0);
    const ring = (r, color, wd) => { g.strokeStyle = color; g.lineWidth = wd * ppm; g.beginPath(); g.arc(cx, cy, r * ppm, 0, Math.PI * 2); g.stroke(); };
    g.fillStyle = '#efe4cb';
    g.beginPath(); g.arc(cx, cy, 11 * ppm, 0, Math.PI * 2); g.fill();
    const petals = 16;
    for (let i = 0; i < petals; i++) {
      const a = i / petals * Math.PI * 2, da = Math.PI / petals;
      g.fillStyle = i % 2 ? '#7a5636' : '#b48a58';
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * 5.4 * ppm, cy + Math.sin(a) * 5.4 * ppm);

      g.fill();
    }
    ring(10.8, '#5a3e27', 0.35);
    ring(10.2, '#c9a25e', 0.12);

// 中庭四面牆：一張貼圖從地面畫到牆頂，橫向一格 6 m，拱窗正中對齊
const WALL_PPM = 64;
function atriumWallTexture() {
  const bay = 6, W = bay * WALL_PPM, H = WALL_TOP * WALL_PPM;
  const tex = canvasTex(W, H, (g) => {
    const Y = y => H - y * WALL_PPM, P = m => m * WALL_PPM;
    // 地面層：胡桃木牆板與暖光壁龕
    g.fillStyle = '#5b3f2b';
    g.fillRect(0, Y(LEVELS[0]), W, P(LEVELS[0]));
    g.fillStyle = '#f2cf92';
    g.fillRect(P(1.2), Y(4.6), P(3.6), P(3.2));
    g.fillStyle = '#e8b86e';
    g.fillRect(P(1.5), Y(4.3), P(3.0), P(2.6));
    g.fillStyle = '#c9a25e';
    g.fillRect(0, Y(5.2), W, P(0.12));
    // 二、三樓迴廊：米色牆、深色木門、壁燈
    for (const [y0, y1] of [[LEVELS[0], LEVELS[1]], [LEVELS[1], LEVELS[2]]]) {
      g.fillStyle = '#eadcc2';
      g.fillRect(0, Y(y1), W, P(y1 - y0));
      g.fillStyle = '#4a3122';
      g.fillRect(P(2.2), Y(y0 + 2.6), P(1.6), P(2.6));
      g.fillStyle = '#c9a25e';
      g.fillRect(P(2.2), Y(y0 + 2.7), P(1.6), P(0.08));
      for (const x of [0.9, 5.1]) {
        g.fillStyle = '#ffe3b0';
        g.beginPath(); g.arc(P(x), Y(y0 + 2.4), P(0.22), 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = '#d9c6a3';
      g.fillRect(0, Y(y0 + 0.15), W, P(0.15));
    }
    // 最上層：白牆與拱窗
    const y0 = LEVELS[2];
    g.fillStyle = '#f2ece0';
    g.fillRect(0, 0, W, P(WALL_TOP - y0));
    const cx = W / 2, aw = P(2.6), top = Y(y0 + 3.9), base = Y(y0 + 0.7);
    g.fillStyle = '#2b3138';
    g.beginPath();
    g.moveTo(cx - aw / 2, base);
    g.lineTo(cx - aw / 2, top + aw / 2);
    g.arc(cx, top + aw / 2, aw / 2, Math.PI, 0);
    g.lineTo(cx + aw / 2, base);
    g.fill();
    g.strokeStyle = '#f2ece0';
    g.lineWidth = 6;
    g.beginPath(); g.moveTo(cx, top); g.lineTo(cx, base); g.stroke();
    for (let k = 1; k < 4; k++) { const y = base - (base - top - aw / 2) * k / 4; g.beginPath(); g.moveTo(cx - aw / 2, y); g.lineTo(cx + aw / 2, y); g.stroke(); }
    g.strokeStyle = '#d8ccb4'; g.lineWidth = 10;
    g.beginPath(); g.arc(cx, top + aw / 2, aw / 2 + 8, Math.PI, 0); g.stroke();
    g.fillStyle = '#d8ccb4';
    g.fillRect(0, Y(WALL_TOP - 0.4), W, P(0.4));
  });
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(1 / bay, 1 / WALL_TOP);
  tex.offset.set(0.5, 0);
  return tex;
}

function goldWallTexture() {

function facadeTex(base, win, floorH = 3.4, bay = 4) {
  const t = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = win; g.fillRect(14, 30, w - 28, 62);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, h - 8, w, 8);
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.userData = { floorH, bay };
  return t;
}

      const len = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);

const RIDE_SPEED = 0.6;
function updateWalkers(dt) {
  for (const w of walkers) {
    const { segs, total } = w.path;
    const v = segs[w.seg].ride ? RIDE_SPEED : w.speed;
    w.s += v * dt;
    if (w.s >= total) { w.s -= total; w.seg = 0; }
    while (w.seg < segs.length - 1 && w.s > segs[w.seg].start + segs[w.seg].len) w.seg++;
    const seg = segs[w.seg];
    const t = Math.min((w.s - seg.start) / seg.len, 1);
    const target = Math.atan2(seg.b.x - seg.a.x, seg.b.z - seg.a.z);
    if (w.heading === null) w.heading = target;
    w.heading += Math.atan2(Math.sin(target - w.heading), Math.cos(target - w.heading)) * Math.min(1, dt * 8);
    if (!seg.ride) w.phase += v * dt / 0.7 * Math.PI;
    const sw = seg.ride ? 0 : Math.sin(w.phase);
    w.g.position.set(
      seg.a.x + (seg.b.x - seg.a.x) * t,
      seg.a.y + (seg.b.y - seg.a.y) * t + (seg.ride ? 0 : Math.abs(Math.cos(w.phase)) * 0.03),
      seg.a.z + (seg.b.z - seg.a.z) * t);
    w.g.rotation.y = w.heading;
    for (const l of w.limbs) { l.leg.rotation.x = sw * 0.45 * l.s; l.arm.rotation.x = -sw * 0.35 * l.s; }
  }
}

  const boost = h('ShiftLeft') || h('ShiftRight') ? 2.5 : 1;
  kbFwd.subVectors(controls.target, camera.position).setY(0);
  if (kbFwd.lengthSq() < 1e-6) kbFwd.set(0, 0, -1).applyQuaternion(camera.quaternion).setY(0);
  kbFwd.normalize();
  kbRight.crossVectors(kbFwd, kbUp).normalize();
  kbMove.set(0, 0, 0);
  if (h('KeyW') || h('ArrowUp')) kbMove.add(kbFwd);
  if (h('KeyS') || h('ArrowDown')) kbMove.sub(kbFwd);
  if (h('KeyD')) kbMove.add(kbRight);
  if (h('KeyA')) kbMove.sub(kbRight);
  if (h('KeyR')) kbMove.y += 1;
  if (h('KeyF')) kbMove.y -= 1;
  let moved = false;
  if (kbMove.lengthSq() > 0) {
    kbMove.normalize().multiplyScalar(KB.speed * boost * dt);
    // 走在地上時，下一步腳下沒有地板（牆外、樓板邊、挑空）就擋下來；按 R/F 飛行時不擋
    // 被擋時依序試左右偏 25°、50°、75°，找得到地板就順著那個方向走（貼牆滑、沿弧形樓梯走）
    // 一步之內腳下高度差超過 0.3 m、或頭頂快撞到東西也算擋住：樓梯、電扶梯旁邊不能直接跨上跨下或鑽到底下
    const flying = h('KeyR') || h('KeyF');
    const g0 = flying ? null : groundBelow();
    const wasOnGround = g0 !== null;
    for (const a of wasOnGround ? KB_SLIDE : [0]) {
      kbTry.copy(kbMove).applyAxisAngle(kbUp, a);
      camera.position.add(kbTry);
      const g1 = wasOnGround ? groundBelow() : null;
      if (!wasOnGround || (g1 !== null && Math.abs(g1 - g0) < 0.3 && !headBlocked() && !hitsSolid())) {
        controls.target.add(kbTry);
        moved = true;
        break;
      }
      camera.position.sub(kbTry);
    }
  }
  const turn = (h('ArrowLeft') || h('KeyQ') ? 1 : 0) - (h('ArrowRight') || h('KeyE') ? 1 : 0);
  if (turn) {
    const off = controls.target.clone().sub(camera.position).applyAxisAngle(kbUp, turn * KB.turn * dt);
    controls.target.copy(camera.position).add(off);
    moved = true;
  }
  if (moved && !(h('KeyR') || h('KeyF'))) followGround(dt);
  return moved;
}
const kbRay = new THREE.Raycaster(), kbDown = new THREE.Vector3(0, -1, 0), kbOrigin = new THREE.Vector3();
const EYE = 1.65;
// 腳下 2.8 m 內可以踩的面高度；沒有就回傳 null（代表在飛或腳下是空的）
function groundBelow() {
  if (!walkables.length) return null;
  // 從頭頂上方一點往下打，走進電扶梯側面、樓梯底下時會先碰到上面的踏面而被擋住
  kbOrigin.copy(camera.position);
  kbOrigin.y += 1.2;
  kbRay.set(kbOrigin, kbDown);
  kbRay.far = 4.6;
  const hit = kbRay.intersectObjects(walkables, false)[0];
  return hit && camera.position.y - hit.point.y <= 2.8 ? hit.point.y : null;
}
function hitsSolid() {
  const p = camera.position;
  return solids.some(c => (c.box
    ? p.x > c.box[0] && p.x < c.box[1] && p.z > c.box[2] && p.z < c.box[3]
    : Math.hypot(p.x - c.x, p.z - c.z) < c.r) && p.y > c.y0 && p.y < c.y1 + 1.8);
}
const kbUpRay = new THREE.Raycaster();
function headBlocked() {
  kbUpRay.set(camera.position, kbUp);
  kbUpRay.far = 0.5;
  return kbUpRay.intersectObjects(walkables, false).length > 0;
}
// 走路時讓視線貼著腳下的面（地板、電扶梯、樓梯）
function followGround(dt) {
  const y = groundBelow();
  if (y === null) return;
  const dy = (y + EYE - camera.position.y) * Math.min(1, dt * 10);
  camera.position.y += dy;
  controls.target.y += dy;
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 600 ? 72 : 60;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const startView = { '#fountain': 'fountain', '#esc': 'esc', '#up': 'up', '#out': 'out' }[location.hash] || 'entry';
goView(startView, true);
applyLights();

// 錄影模式：不自己跑動畫迴圈，由錄影程式一格一格推進
if (location.search.includes('rec')) {
  window.__rec = {
    frame(dt, p, t) {
      if (walking) updateWalkers(dt);
      const f = 1 - Math.pow(1 - 0.07, dt * 60);
      for (const k in cur) cur[k] += (lightTarget[k] - cur[k]) * f;
      applyLights();
      camera.position.set(p[0], p[1], p[2]);
      controls.target.set(t[0], t[1], t[2]);
      camera.lookAt(controls.target);
      const hide = cutaway && camera.position.y > RIDGE.y + 0.5;
      if (hide !== roofHidden) setRoofHidden(hide);
      for (const g of crowd) {
        const dx = g.position.x - p[0], dz = g.position.z - p[2], dy = p[1] - g.position.y;
        g.visible = !(Math.hypot(dx, dz) < 1.3 && dy > -0.5 && dy < 2.6);
      }
      renderer.render(scene, camera);
      return true;
    },
    // 導覽影片要自己搭電扶梯，先把搭電扶梯的行人拿掉免得撞在一起
    noEscalatorWalkers() {
      for (let i = walkers.length - 1; i >= 0; i--) {
        if (walkers[i].path.segs.some(sg => sg.ride)) { walkers[i].g.visible = false; crowd.splice(crowd.indexOf(walkers[i].g), 1); walkers.splice(i, 1); }
      }
    }
  };
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = performance.now();
if (!window.__rec) renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (walking) updateWalkers(dt);
  for (const k in cur) cur[k] += (lightTarget[k] - cur[k]) * 0.07;
  applyLights();
  if (tween) {
    const t = Math.min((now - tween.t0) / 1400, 1), e = ease(t);
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
    controls.target.lerpVectors(tween.from.target, tween.to.target, e);
    if (t === 1) tween = null;
  }
  if (keyboardMove()) { tween = null; for (const k in viewBtns) document.getElementById(viewBtns[k]).setAttribute('aria-pressed', 'false'); }
  controls.update();
  if (camera.position.y < 0.3) camera.position.y = 0.3;
  const hide = cutaway && camera.position.y > RIDGE.y + 0.5;
  if (hide !== roofHidden) setRoofHidden(hide);
  renderer.render(scene, camera);
});
</script>
<script>
  // 控制卡收合：手機預設收起，記住使用者上次的選擇
  (() => {
    const panel = document.getElementById('panel');
    const body = document.getElementById('panel-body');
    const btn = document.getElementById('toggle');
    const KEY = 'gh-panel-collapsed';
    function setCollapsed(c) {
      body.hidden = c;
      panel.classList.toggle('collapsed', c);
      btn.textContent = c ? '展開' : '收合';
      btn.setAttribute('aria-expanded', String(!c));
    }
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    setCollapsed(saved === null ? innerWidth < 600 : saved === '1');
    btn.addEventListener('click', () => {
      const c = !body.hidden;
      setCollapsed(c);
      try { localStorage.setItem(KEY, c ? '1' : '0'); } catch (e) {}
    });
  })();
</script>
<script>
  // 操作說明：開場顯示，開始操作後幾秒淡出；按著的鍵和滑鼠鍵會亮起來。觸控裝置不顯示
  (() => {
    const el = document.getElementById('keyhint');
    const showBtn = document.getElementById('kh-show');
    const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    if (touchOnly || location.search.includes('rec')) { showBtn.hidden = true; return; }
    const MAP = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyQ: 'q', KeyE: 'e', KeyR: 'r', KeyF: 'f',
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', ShiftLeft: 'shift', ShiftRight: 'shift' };
    let timer = null;
    function hide() {
      el.classList.remove('on');
      setTimeout(() => { if (!el.classList.contains('on')) el.hidden = true; }, 400);
    }
    function show(autoHide) {
      el.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      clearTimeout(timer);
      if (autoHide) timer = setTimeout(hide, autoHide);
    }
    addEventListener('keydown', e => {
      const k = MAP[e.code];
      if (!k) return;
      el.querySelector('[data-k="' + k + '"]')?.classList.add('down');
      if (!el.hidden && k !== 'shift') { clearTimeout(timer); timer = setTimeout(hide, 2500); }
    });
    addEventListener('keyup', e => {
      const k = MAP[e.code];
      if (k) el.querySelector('[data-k="' + k + '"]')?.classList.remove('down');
    });
    addEventListener('blur', () => el.querySelectorAll('.down').forEach(n => n.classList.remove('down')));
    // 滑鼠：左鍵、右鍵、滾輪也跟著亮
    const stage = document.getElementById('stage');
    const mset = (m, on) => el.querySelectorAll('[data-m="' + m + '"]').forEach(n => n.classList.toggle('down', on));
    const soonHide = () => { if (!el.hidden) { clearTimeout(timer); timer = setTimeout(hide, 2500); } };
    stage.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;
      mset(e.button === 2 ? 'right' : e.button === 1 ? 'wheel' : 'left', true);
      soonHide();
    });
    addEventListener('pointerup', () => ['left', 'right', 'wheel'].forEach(m => mset(m, false)));
    let wheelTimer = null;
    stage.addEventListener('wheel', () => {
      mset('wheel', true);
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => mset('wheel', false), 250);
      soonHide();
    }, { passive: true });
    el.addEventListener('click', hide);
    showBtn.addEventListener('click', () => show(0));
    show(10000);
  })();
</script>
<script>
  // 模組載不到時給個說明，不要留白
  setTimeout(() => {
    if (!document.querySelector('#stage canvas')) {
      const p = document.createElement('p');
      p.className = 'err';
      p.textContent = '3D 引擎沒有載入成功，請重新整理頁面。若仍空白，可能是瀏覽器不支援 WebGL。';
      document.body.appendChild(p);
    }
  }, 6000);
</script>
