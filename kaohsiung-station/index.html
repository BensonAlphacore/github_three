<html lang="zh-Hant">

<title>高雄車站大廳 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 全螢幕 3D 場景，左上角一張控制卡 */
  :root {
    --bg: #cfdde6;
    --panel: rgba(250, 251, 251, 0.9);
    --fg: #1b2328;
    --muted: #5a676e;
    --line: #c2ccd1;
    --accent: #1f5f8b;
    --accent-fg: #ffffff;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161c; --panel: rgba(26, 33, 39, 0.9); --fg: #e4eaee; --muted: #97a5ad;
      --line: #34414a; --accent: #74afd6; --accent-fg: #0d1820; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161c; --panel: rgba(26, 33, 39, 0.9); --fg: #e4eaee; --muted: #97a5ad;
    --line: #34414a; --accent: #74afd6; --accent-fg: #0d1820; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(310px, calc(100% - 32px));
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid;
    gap: 12px;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .body { display: grid; gap: 12px; }
  .toggle { flex: none; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .toggle:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .panel.collapsed { width: auto; padding-block: 10px; }
  .panel.collapsed .eyebrow { display: none; }
  .panel.collapsed h1 { margin: 0; font-size: 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  h1 { margin: 2px 0 0; font-size: 20px; font-weight: 700; text-wrap: balance; }
  .dims { display: grid; gap: 4px; margin: 0; font-size: 12px; }
  .dims div { display: flex; justify-content: space-between; gap: 12px; }
  .dims dt { color: var(--muted); }
  .dims dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .label { font-size: 11px; color: var(--muted); margin-bottom: -6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; padding: 7px 0; cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 500; }
  .seg button:hover:not([aria-pressed="true"]) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .row input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  button:focus-visible, .row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note, .hint { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 520px) { .note { display: none; } .seg button { font-size: 12px; } }

  /* 鍵盤操作說明：開場浮在畫面下方的半透明鍵帽 */
  .keyhint {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    transform: translate(-50%, 10px); opacity: 0; transition: opacity 0.35s, transform 0.35s;
    max-width: calc(100% - 32px); padding: 14px 20px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--panel) 60%, transparent); backdrop-filter: blur(10px);
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    color: var(--fg); display: grid; gap: 10px; cursor: pointer;
  }
  .keyhint.on { opacity: 1; transform: translate(-50%, 0); }
  .kh-title { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-align: center; }
  .kh-groups { display: flex; gap: 26px; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
  .kh-group { display: grid; gap: 6px; justify-items: center; }
  .kh-row { display: flex; gap: 6px; }
  .key { display: grid; justify-items: center; gap: 4px; }
  .key kbd {
    min-width: 40px; height: 40px; padding: 0 9px; display: grid; place-items: center; border-radius: 8px;
    font: 600 15px var(--font-mono); color: var(--fg);
    background: color-mix(in srgb, var(--panel) 70%, transparent); border: 1px solid var(--line);
    box-shadow: 0 3px 0 color-mix(in srgb, var(--fg) 22%, transparent);
    transition: transform 0.08s, background 0.08s, color 0.08s;
  }
  .key.down kbd { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 22%, transparent); background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .key span { font-size: 11px; color: var(--muted); }
  .mouse-wrap { display: flex; gap: 10px; align-items: center; }
  .mouse { width: 34px; height: 50px; overflow: visible; }
  .m-body { fill: color-mix(in srgb, var(--panel) 70%, transparent); stroke: var(--line); stroke-width: 1.5; }
  .m-btn { fill: transparent; stroke: var(--line); stroke-width: 1.5; transition: fill 0.08s; }
  .m-wheel { fill: var(--muted); transition: fill 0.08s; }
  .m-btn.down, .m-wheel.down { fill: var(--accent); }
  .mouse-labels { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
  .mouse-labels b { color: var(--fg); font-weight: 600; margin-right: 4px; }
  .mouse-labels span.down b { color: var(--accent); }
  .kh-foot { font-size: 11px; color: var(--muted); text-align: center; }
  .linkbtn { justify-self: start; border: 0; background: none; padding: 0; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .keyhint, .key kbd { transition: none; } }
</style>

</div>

<div class="panel" id="panel">
  <div class="head">
    <div>
      <div class="eyebrow">three.js 建築示意</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// 單位：公尺。y=0 是地面層，B1 廣場在 y=-7.5
const B1 = -7.5;
const SLAB = 1.2;                         // 地面層樓板厚
const HOLE = { a: 42, b: 32 };            // 下沉廣場開口
const B1W = { a: 58, b: 46 };             // B1 大廳外牆
const ROOF = { w: 200, h: 150, r: 40, y: 9.2, t: 1.0 };
const ROOF_TOP = ROOF.y + ROOF.t;
const DISK_Y = [7.9, 8.8];
const DISK_T = 0.28;
const FLANGE = { w: 3.2, y0: 7.3, y1: 8.3 };   // 天窗下緣那圈白色寬框
const STAIR = { x: -60, z: 18 };
const OCULI = [
  { x: 2, z: -4, a: 12, b: 9.5 },
  { x: STAIR.x, z: STAIR.z, a: 9, b: 8 },
  { x: 58, z: -22, a: 9, b: 7 },
  { x: 38, z: 44, a: 7, b: 6 },
  { x: -46, z: -46, a: 7.5, b: 6 }
];
const PAVILIONS = [{ x: -76, z: -26, r: 6 }, { x: 72, z: 22, r: 6 }];

if (matchMedia('(pointer: coarse)').matches) {
  document.getElementById('hint').textContent = '單指旋轉、雙指縮放與平移。';
}

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const walkables = [];      // 鍵盤走動時腳下可以踩的面
const solids = [];         // 走路會撞到的東西：圓柱 { x, z, r, y0, y1 } 或方塊 { box: [x0, x1, z0, z1], y0, y1 }
scene.background = new THREE.Color(0xcfe0ea);
scene.fog = new THREE.Fog(0xcfe0ea, 180, 520);

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomToCursor = true;
controls.minDistance = 1;
controls.maxDistance = 340;

let seed = 20241228;
const rand = () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...opts });
const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const UP = new THREE.Vector3(0, 1, 0);

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// Shape 在 XY 平面畫，轉成水平後 shape 的 y 會變成世界的 -z
function ellipsePath(PathType, x, z, a, b) {
  const p = new PathType();
  p.absellipse(x, -z, a, b, 0, Math.PI * 2, false);
  return p;
}
function flatExtrude(shape, depth, y) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 64 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, y, 0);
  return g;
}
const inRoundedRect = (x, z, w, h, r) => {
  if (Math.abs(x) > w / 2 || Math.abs(z) > h / 2) return false;
  const dx = Math.max(Math.abs(x) - (w / 2 - r), 0), dz = Math.max(Math.abs(z) - (h / 2 - r), 0);
  return dx * dx + dz * dz <= r * r;
};
const inEllipse = (x, z, cx, cz, a, b) => ((x - cx) / a) ** 2 + ((z - cz) / b) ** 2 < 1;
const ellPoint = (phi, e) => ({ x: e.a * Math.cos(phi), z: e.b * Math.sin(phi) });
const ellSpeed = (phi, e) => Math.hypot(e.a * Math.sin(phi), e.b * Math.cos(phi));
const angDiff = (p, q) => Math.abs(Math.atan2(Math.sin(p - q), Math.cos(p - q)));

// 兩點之間放一根管子
function tubeBetween(from, to, rTop, rBottom, seg = 14) {
  const dir = to.clone().sub(from);
  const g = new THREE.CylinderGeometry(rTop, rBottom, dir.length(), seg);
  g.applyMatrix4(new THREE.Matrix4().compose(
    from.clone().add(to).multiplyScalar(0.5),
    new THREE.Quaternion().setFromUnitVectors(UP, dir.normalize()),
    new THREE.Vector3(1, 1, 1)
  ));
  return g;
}

// 沿著一串點拉出垂直的帶子（欄杆玻璃、白牆、屋頂邊）
function ribbon(points, y0, y1) {
  const pos = [], idx = [];
  points.forEach((p, i) => {
    pos.push(p.x, y0, p.z, p.x, y1, p.z);
    if (i > 0) {
      const a = (i - 1) * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ---------- 貼圖 ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const tex = new THREE.CanvasTexture(c);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// B1 地板：中間一圈寬淺、一圈窄深的同心圓，外圍深灰地磚
function ringTexture() {
  return canvasTex(2048, 2048, g => {
    const ppm = 1024 / B1W.a;
    g.fillStyle = '#7d8183';
    g.fillRect(0, 0, 2048, 2048);
    g.strokeStyle = 'rgba(40,44,46,0.35)';
    g.lineWidth = 1;
    for (let k = 0; k < 2048; k += ppm * 1.2) {
      g.beginPath(); g.moveTo(k, 0); g.lineTo(k, 2048); g.stroke();
      g.beginPath(); g.moveTo(0, k); g.lineTo(2048, k); g.stroke();
    }
    let r = (HOLE.a - 2) * ppm;
    let light = true;
    g.beginPath(); g.arc(1024, 1024, r + 0.6 * ppm, 0, Math.PI * 2);
    g.fillStyle = '#8d9193'; g.fill();
    while (r > 0) {
      g.beginPath();
      g.arc(1024, 1024, r, 0, Math.PI * 2);
      g.fillStyle = light ? '#c3c5c5' : '#8a8e90';
      g.fill();
      r -= (light ? 2.4 + rand() * 0.8 : 0.8 + rand() * 0.4) * ppm;
      light = !light;
    }
  });
}

// 地面層：灰色長方形地磚，一張貼圖代表 4.8 m 見方
function paverTexture() {
  const tex = canvasTex(1024, 1024, g => {
    const tones = ['#9da0a2', '#b4b6b7', '#c7c8c8', '#878b8d', '#a9acad', '#bdbfbf'];
    const rh = 64, len = 128;
    for (let row = 0; row < 1024 / rh; row++) {
      const off = (row % 2) * len / 2;
      for (let x = -off; x < 1024; x += len) {
        g.fillStyle = tones[Math.floor(rand() * tones.length)];
        g.fillRect(x, row * rh, len, rh);
        g.fillStyle = 'rgba(50,52,54,0.6)';
        g.fillRect(x, row * rh, 2, rh);
      }
      g.fillRect(0, row * rh, 1024, 2);
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1 / 4.8, 1 / 4.8);
  return tex;
}

function shopTexture() {
  const tex = canvasTex(1024, 256, g => {
    g.fillStyle = '#e9e8e4';
    g.fillRect(0, 0, 1024, 256);
    const fronts = ['#3c4a52', '#f0d6a4', '#4a5961', '#e9c78c', '#35424a', '#d9e4ea'];
    for (let i = 0; i < 4; i++) {
      const x = i * 256 + 18;
      g.fillStyle = '#2f3539';
      g.fillRect(x, 40, 220, 24);
      g.fillStyle = '#f5f3ee';
      g.fillRect(x + 20, 46, 70 + rand() * 90, 11);
      g.fillStyle = fronts[Math.floor(rand() * fronts.length)];
      g.fillRect(x, 72, 220, 184);
      g.fillStyle = 'rgba(220,225,228,0.5)';
      for (let k = 1; k < 5; k++) g.fillRect(x + k * 44, 72, 3, 184);
    }
  });
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(30, 1);
  return tex;
}

function skylightTexture() {
  return canvasTex(1024, 1024, g => {
    g.fillStyle = 'rgba(225,238,246,0.16)';
    g.fillRect(0, 0, 1024, 1024);
    g.fillStyle = 'rgba(250,250,250,1)';
    for (let k = 0; k <= 1024; k += 64) {
      g.fillRect(k - 4, 0, 8, 1024);
      g.fillRect(0, k - 2, 1024, 4);
    }
  });
}

function addEscalatorPair(e) {
  const top = insetPoint(e.top, INSET);

{

  const legAngle = k => k * Math.PI * 2 / legs + Math.PI / 4;
  for (let k = 0; k < legs; k++) {
    const a = legAngle(k);
    parts.push(tubeBetween(
      new THREE.Vector3(Math.cos(a) * d0, 0, Math.sin(a) * d0),

// 雲朵板：大小不一的純白橢圓厚板，上下錯開、互相疊一點
const disks = [];
{
  const cell = 4, grid = new Map();
  const key = (i, j) => i + ',' + j;
  for (let n = 0; n < 60000; n++) {
    const x = (rand() - 0.5) * ROOF.w, z = (rand() - 0.5) * ROOF.h;
    const r = 0.9 + Math.pow(rand(), 1.5) * 2.7;
    if (!inRoundedRect(x, z, ROOF.w - 4, ROOF.h - 4, ROOF.r - 2)) continue;
    if (OCULI.some(o => inEllipse(x, z, o.x, o.z, o.a + FLANGE.w + r * 0.4, o.b + FLANGE.w + r * 0.4))) continue;
    const ci = Math.floor(x / cell), cj = Math.floor(z / cell);
    let ok = true;
    for (let i = ci - 2; i <= ci + 2 && ok; i++) for (let j = cj - 2; j <= cj + 2 && ok; j++) {
      for (const q of grid.get(key(i, j)) || []) {
        if (Math.hypot(q.x - x, q.z - z) < (q.r + r) * 0.64) { ok = false; break; }
      }
    }
    if (!ok) continue;
    const d = { x, z, r, sz: 0.6 + rand() * 0.4, rot: rand() * Math.PI, y: DISK_Y[0] + rand() * (DISK_Y[1] - DISK_Y[0]) };
    disks.push(d);
    const k = key(ci, cj);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(d);
  }
}
const diskMat = mat(0xffffff, { roughness: 0.5, emissive: 0xffffff, emissiveIntensity: 0.14 });
const lampBodyMat = new THREE.MeshStandardMaterial({ color: 0xf1efe9, roughness: 0.35, emissive: 0xffe6c4, emissiveIntensity: 0.05 });

{
  const diskMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, DISK_T, 28), diskMat, disks.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const color = new THREE.Color();
  disks.forEach((d, i) => {
    q.setFromAxisAngle(UP, d.rot);
    m.compose(p.set(d.x, d.y, d.z), q, s.set(d.r, 1, d.r * d.sz));

  const stems = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.045, 0.045, stemLen, 8), mat(0x2a2e31, { roughness: 0.5, metalness: 0.5 }), hanging.length);

    bodies.setMatrixAt(i, m);

// ---------- 白色旋轉梯，從地面層繞上屋頂 ----------
{
  const R = 5.2, W = 1.7, T = 0.45, turns = 1.6, H = ROOF_TOP, N = 260, a0 = 0.9;
  const ri = R - W / 2, ro = R + W / 2;
  const at = (t, r, dy = 0) => {
    const a = a0 + t * turns * Math.PI * 2;
    return [STAIR.x + Math.cos(a) * r, t * H + dy, STAIR.z + Math.sin(a) * r];
  };
  const strip = (fa, fb) => {
    const pos = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      pos.push(...fa(t), ...fb(t));
      if (i > 0) { const k = (i - 1) * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  };
  const stairMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f2, roughness: 0.45, side: THREE.DoubleSide });
  const geos = [
    strip(t => at(t, ri), t => at(t, ro)),
    strip(t => at(t, ri, -T), t => at(t, ro, -T)),
    strip(t => at(t, ro), t => at(t, ro, -T)),
    strip(t => at(t, ri), t => at(t, ri, -T))
  ];
  geos.forEach((g, i) => {

  });

    for (let i = 0; i <= count; i++) postsPer.push(at(i / count, r));
    const curve = new THREE.CatmullRomCurve3(Array.from({ length: 121 }, (_, i) => new THREE.Vector3(...at(i / 120, r, 1.05))));
    scene.add(shadowed(new THREE.Mesh(new THREE.TubeGeometry(curve, 400, 0.04, 6, false), stairMat)));
  }
  const posts = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.018, 0.018, 1.05, 6), stairMat, postsPer.length);
  const m = new THREE.Matrix4();
  postsPer.forEach((p, i) => { m.makeTranslation(p[0], p[1] + 0.525, p[2]); posts.setMatrixAt(i, m); });
  scene.add(shadowed(posts));
  // 中間的支撐柱與底座
  scene.add(shadowed(new THREE.Mesh(tubeBetween(new THREE.Vector3(STAIR.x, 0, STAIR.z), new THREE.Vector3(STAIR.x, H - 0.5, STAIR.z), 0.5, 0.5, 24), stairMat)));
  const b = at(0, R);

  const p = camera.position;
  return solids.some(c => (c.box
    ? p.x > c.box[0] && p.x < c.box[1] && p.z > c.box[2] && p.z < c.box[3]
    : Math.hypot(p.x - c.x, p.z - c.z) < c.r) && p.y > c.y0 && p.y < c.y1 + 1.8);
}
const kbUpRay = new THREE.Raycaster();
function headBlocked() {
  kbUpRay.set(camera.position, kbUp);
  kbUpRay.far = 0.5;
  return kbUpRay.intersectObjects(walkables, false).length > 0;
}
// 走路時讓視線貼著腳下的面（地板、電扶梯、樓梯）
function followGround(dt) {
  const y = groundBelow();
  if (y === null) return;
  const dy = (y + EYE - camera.position.y) * Math.min(1, dt * 10);
  camera.position.y += dy;
  controls.target.y += dy;
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 600 ? 72 : 60;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

goView(location.hash === '#stair' ? 'stair' : location.hash === '#floor' ? 'floor' : location.hash === '#air' ? 'air' : 'rail', true);
applyLights();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (walking) updateWalkers(dt);
  for (const k in cur) cur[k] += (lightTarget[k] - cur[k]) * 0.07;
  applyLights();
  if (tween) {
    const t = Math.min((now - tween.t0) / 1400, 1), e = ease(t);
    camera.position.lerpVectors(tween.from.pos, tween.to.pos, e);
    controls.target.lerpVectors(tween.from.target, tween.to.target, e);
    if (t === 1) tween = null;
  }
  if (keyboardMove()) { tween = null; for (const k in viewBtns) document.getElementById(viewBtns[k]).setAttribute('aria-pressed', 'false'); }
  controls.update();
  if (camera.position.y < B1 + 0.4) camera.position.y = B1 + 0.4;
  const hide = cutaway && camera.position.y > ROOF_TOP + 0.5;
  if (hide !== roofHidden) setRoofHidden(hide);
  renderer.render(scene, camera);
});
</script>
<script>
  // 控制卡收合：手機預設收起，記住使用者上次的選擇
  (() => {
    const panel = document.getElementById('panel');
    const body = document.getElementById('panel-body');
    const btn = document.getElementById('toggle');
    const KEY = 'khh-panel-collapsed';
    function setCollapsed(c) {
      body.hidden = c;
      panel.classList.toggle('collapsed', c);
      btn.textContent = c ? '展開' : '收合';
      btn.setAttribute('aria-expanded', String(!c));
    }
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    setCollapsed(saved === null ? innerWidth < 600 : saved === '1');
    btn.addEventListener('click', () => {
      const c = !body.hidden;
      setCollapsed(c);
      try { localStorage.setItem(KEY, c ? '1' : '0'); } catch (e) {}
    });
  })();
</script>
<script>
  // 操作說明：開場顯示，開始操作後幾秒淡出；按著的鍵和滑鼠鍵會亮起來。觸控裝置不顯示
  (() => {
    const el = document.getElementById('keyhint');
    const showBtn = document.getElementById('kh-show');
    const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    if (touchOnly || location.search.includes('rec')) { showBtn.hidden = true; return; }
    const MAP = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyQ: 'q', KeyE: 'e', KeyR: 'r', KeyF: 'f',
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', ShiftLeft: 'shift', ShiftRight: 'shift' };
    let timer = null;
    function hide() {
      el.classList.remove('on');
      setTimeout(() => { if (!el.classList.contains('on')) el.hidden = true; }, 400);
    }
    function show(autoHide) {
      el.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      clearTimeout(timer);
      if (autoHide) timer = setTimeout(hide, autoHide);
    }
    addEventListener('keydown', e => {
      const k = MAP[e.code];
      if (!k) return;
      el.querySelector('[data-k="' + k + '"]')?.classList.add('down');
      if (!el.hidden && k !== 'shift') { clearTimeout(timer); timer = setTimeout(hide, 2500); }
    });
    addEventListener('keyup', e => {
      const k = MAP[e.code];
      if (k) el.querySelector('[data-k="' + k + '"]')?.classList.remove('down');
    });
    addEventListener('blur', () => el.querySelectorAll('.down').forEach(n => n.classList.remove('down')));
    // 滑鼠：左鍵、右鍵、滾輪也跟著亮
    const stage = document.getElementById('stage');
    const mset = (m, on) => el.querySelectorAll('[data-m="' + m + '"]').forEach(n => n.classList.toggle('down', on));
    const soonHide = () => { if (!el.hidden) { clearTimeout(timer); timer = setTimeout(hide, 2500); } };
    stage.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;
      mset(e.button === 2 ? 'right' : e.button === 1 ? 'wheel' : 'left', true);
      soonHide();
    });
    addEventListener('pointerup', () => ['left', 'right', 'wheel'].forEach(m => mset(m, false)));
    let wheelTimer = null;
    stage.addEventListener('wheel', () => {
      mset('wheel', true);
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => mset('wheel', false), 250);
      soonHide();
    }, { passive: true });
    el.addEventListener('click', hide);
    showBtn.addEventListener('click', () => show(0));
    show(10000);
  })();
</script>
